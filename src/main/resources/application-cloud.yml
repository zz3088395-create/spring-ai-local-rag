spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      base-url: https://api.siliconflow.cn
      api-key: ${SF_API_KEY:xxxxxxxxxx}
      chat:
        options:
          model: Qwen/Qwen3-14B
          temperature: 0.7
      embedding:
        options:
          model: BAAI/bge-m3